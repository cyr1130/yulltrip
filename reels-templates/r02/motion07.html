<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>모션 07</title>
<script src="https://cdn.jsdelivr.net/npm/mp4-muxer@5.1.3/build/mp4-muxer.js"></script>
<script src="assets_m07.js"></script><script src="engine.js"></script></head>
<body>
<script>
const E = Engine; let ctx;
const { W, H, FPS, clamp, lerp, prog, easeOut, easeIn, easeInOut, back, kf, kf2 } = E;

const S = {
  img: { footage: [] },
  prompt: "기념일 까먹은 줄 알았던 남친이 사실 1년 동안 준비하고 있었다", plus: "+", sendIcon: "↑",
  cursorOn: true, zoom: 1.1,
  colors: { bar: "#ffffff", promptText: "#262626", plus: "#8a8a8a", send: "#e8774a", sendIcon: "#ffffff", ring: "#e8774a", cursor: "#111111" },
  d1: 12, d2: 20,
};
const T = () => { const a = +S.d1, b = +S.d2; return { s2: a, total: a + b }; };
const im = k => (S.img[k][0] || {}).img;
const CX = W / 2;   // 가로 가운데 (720)
const BAR = { w: 1344, h: 236, r: 44, y: 1420 }; BAR.x = CX - BAR.w / 2;
const SEND = { s: 112, y: 1534 }; SEND.x = BAR.x + BAR.w - 28 - SEND.s;   // 입력창 오른쪽 안쪽
const SX = SEND.x + SEND.s / 2, SY = SEND.y + SEND.s / 2;   // 전송 버튼 가운데 (커서 · 링 기준)

function footage(f) {
  const z = lerp(1, +S.zoom || 1, easeInOut(prog(f, 0, T().total)));
  ctx.save(); ctx.translate(720, 1100); ctx.scale(z, z); ctx.translate(-720, -1100);
  const img = im("footage"); if (img) E.cover(img, 0, 0, W, H, 0, false); else { ctx.fillStyle = "#3a3330"; ctx.fillRect(0, 0, W, H); }
  ctx.restore();
}
function bar(yOff, press) {
  ctx.save(); ctx.translate(0, yOff);
  E.shadowed(() => { E.rr(BAR.x, BAR.y, BAR.w, BAR.h, BAR.r); ctx.fillStyle = S.colors.bar; ctx.fill(); }, 30, 8, "rgba(0,0,0,.18)");
  ctx.fillStyle = S.colors.promptText; ctx.textBaseline = "middle"; let fs = 38; ctx.font = `500 ${fs}px ${E.SANS}`;
  const mw = SEND.x - BAR.x - 80, tw = ctx.measureText(S.prompt).width; if (tw > mw) { fs = Math.max(22, fs * mw / tw); ctx.font = `500 ${fs}px ${E.SANS}`; }
  ctx.fillText(S.prompt, BAR.x + 44, BAR.y + 66);
  ctx.fillStyle = S.colors.plus; ctx.font = `300 52px ${E.SANS}`; ctx.fillText(S.plus, BAR.x + 42, BAR.y + 172);
  const k = 1 - .12 * press, c = SEND.s / 2;
  ctx.save(); ctx.translate(SEND.x + c, SEND.y + c); ctx.scale(k, k);
  E.rr(-c, -c, SEND.s, SEND.s, 28); ctx.fillStyle = S.colors.send; ctx.fill();
  ctx.fillStyle = S.colors.sendIcon; ctx.font = `700 62px ${E.SANS}`; ctx.textAlign = "center"; ctx.fillText(S.sendIcon, 0, 3);
  ctx.restore(); ctx.restore();
}
function ring(h, k) {
  const cx = SEND.x + SEND.s / 2, cy = SEND.y + SEND.s / 2;
  [0, 3.5].forEach(d => { const p = prog(h, (.5 + d) * k, (9.5 + d) * k); if (p <= 0 || p >= 1) return;
    ctx.save(); ctx.globalAlpha = (1 - p) * (d ? .6 : 1); ctx.strokeStyle = S.colors.ring; ctx.lineWidth = lerp(9, 3, p);
    ctx.beginPath(); ctx.arc(cx, cy, lerp(70, 210, easeOut(p)), 0, 7); ctx.stroke(); ctx.restore(); });
}

E.start({
  title: "모션 07 · 영상 위 프롬프트 오버레이", group: "릴스02 템플릿", file: "motion07", state: S,
  intro: "영상 위로 작은 입력창이 쑥 올라오고, 커서가 전송 버튼을 누르면 링이 퍼져요.",
  images: { "img.footage": [{ file: "m07_footage.jpg" }] },
  sections: [
    { title: "공통", hint: "배경 영상(사진)은 처음부터 끝까지 이어져요.",
      rows: [[{ type: "images", key: "img.footage", label: "배경 영상 장면 (세로)" }, { type: "number", key: "zoom", label: "천천히 확대 배율 (1 = 고정)", min: 1, max: 2 }]] },
    { title: "① 입력창 등장", durKey: "1", rows: [[{ type: "textarea", key: "prompt", label: "프롬프트 문장" }],
        [{ key: "plus", label: "왼쪽 아래 기호" }, { key: "sendIcon", label: "전송 버튼 기호" }],
        [{ type: "number", key: "d1", label: "길이 (프레임)", min: 6, max: 60 }],
        [{ type: "sub", label: "색상" }], [{ type: "color", key: "colors.bar", label: "입력창" }, { type: "color", key: "colors.promptText", label: "프롬프트 글자" }],
        [{ type: "color", key: "colors.plus", label: "+ 기호" }, { type: "color", key: "colors.send", label: "전송 버튼" }], [{ type: "color", key: "colors.sendIcon", label: "전송 버튼 기호" }]] },
    { title: "② 전송 + 링", durKey: "2", rows: [[{ type: "bool", key: "cursorOn", label: "커서 보이기" }, { type: "number", key: "d2", label: "길이 (프레임)", min: 8, max: 90 }],
        [{ type: "sub", label: "색상" }], [{ type: "color", key: "colors.ring", label: "퍼지는 링" }, { type: "color", key: "colors.cursor", label: "커서" }]] },
  ],
  durations: { 1: S => +S.d1, 2: S => +S.d2 },
  length: () => T().total,
  render(f) {
    ctx = E.ctx; const t = T(), k1 = +S.d1 / 12, k2 = +S.d2 / 20;
    footage(f);
    // ① 입력창이 아래에서 쑥 올라옴
    const up = easeOut(prog(f, .6 * k1, 7 * k1)), yOff = lerp(H - BAR.y + 40, 0, up);
    // ② 커서가 전송 버튼을 누름 → 링
    const h = f - t.s2, click = 3 * k2, press = Math.exp(-Math.pow((h - click) / (1.3 * k2), 2)) * (S.cursorOn ? 1 : .6);
    bar(yOff, press);
    ring(h - click, k2 * 1.2);
    if (S.cursorOn) {
      const c0 = 4 * k1, ca = clamp(prog(f, c0, c0 + 3));
      if (ca > 0) { const [cx, cy] = kf2(f, [[c0, SX - 268, 2260], [t.s2 + click - 1.2 * k2, SX - 2, SY + 10], [t.s2 + click + 1.5 * k2, SX - 8, SY + 2], [t.total, SX - 88, SY + 190]]);
        ctx.save(); ctx.shadowColor = "rgba(255,255,255,.95)"; ctx.shadowBlur = 8; E.cursor(cx - 8, cy - 6, "", S.colors.cursor, 2.0 * (1 - .12 * press), ca); ctx.restore(); }
    }
  },
});
</script>
