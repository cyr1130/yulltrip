<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>모션 06</title>
<script src="https://cdn.jsdelivr.net/npm/mp4-muxer@5.1.3/build/mp4-muxer.js"></script>
<script src="assets_m06.js"></script><script src="engine.js"></script></head>
<body>
<script>
const E = Engine; let ctx;
const { W, H, FPS, clamp, lerp, prog, easeOut, easeIn, easeInOut, back } = E;

const S = {
  img: { render: [] },
  fileName: "완성_드라마_D365_20초", pctStart: 0, pctEnd: 88, cardScale: 1.4, showImage: true,
  keyMode: "dark", keyBg: "#00ff00",
  colors: { bg: "#13111b", grid: "#24212e",
            render: "#18181c", renderName: "#b9b9c2", barTrack: "#2c2b35", bar: "#8571fd", pct: "#a898ff" },
  d1: 8, d2: 44, d3: 14,
};
const im = k => (S.img[k][0] || {}).img;
const T = () => { const a = +S.d1, b = +S.d2, c = +S.d3; return { s2: a, s3: a + b, total: a + b + c }; };
const RC = { w: 868, h: 512 };

function renderCard(f) {
  const t = T(), p = prog(f, 0, Math.max(4, +S.d1)); if (p <= 0) return;
  const a0 = +S.pctStart, a1 = +S.pctEnd, pc = Math.round(lerp(a0, a1, easeOut(prog(f, t.s2, t.s3))));
  const K = clamp(+S.cardScale || 1, .4, 1.6);
  ctx.save(); ctx.globalAlpha *= clamp(p * 2.5); const s = K * lerp(.85, 1, back(p)); ctx.translate(720, 1280); ctx.scale(s, s); ctx.translate(-RC.w / 2, -RC.h / 2);
  const shadow = S.keyMode === "dark";
  const box = () => { E.rr(0, 0, RC.w, RC.h, 22); ctx.fillStyle = S.colors.render; ctx.fill(); };
  if (shadow) E.shadowed(box, 40, 14, "rgba(0,0,0,.4)"); else box();
  // 미리보기 이미지: 진행될수록 서서히 드러남
  const img = im("render"), ia = S.showImage ? clamp((pc - a0 - .7 * (a1 - a0)) / (.25 * (a1 - a0) || 1)) : 0;
  if (img && ia > 0) { ctx.save(); ctx.globalAlpha *= ia; E.cover(img, 0, 0, RC.w, RC.h, 22, false); const g = ctx.createLinearGradient(0, RC.h * .5, 0, RC.h); g.addColorStop(0, "rgba(0,0,0,0)"); g.addColorStop(1, "rgba(0,0,0,.55)"); ctx.fillStyle = g; E.rr(0, 0, RC.w, RC.h, 22); ctx.fill(); ctx.restore(); }
  E.rr(0, 0, RC.w, RC.h, 22); ctx.strokeStyle = "rgba(255,255,255,.07)"; ctx.lineWidth = 2; ctx.stroke();
  ctx.fillStyle = S.colors.renderName; ctx.font = `500 32px ${E.SANS}`; ctx.textBaseline = "middle"; ctx.fillText(S.fileName, 40, 52);
  ctx.fillStyle = S.colors.pct; ctx.font = `700 40px ${E.SANS}`; ctx.textAlign = "right"; ctx.fillText(pc + "%", RC.w - 40, RC.h - 108);
  E.rr(40, RC.h - 62, RC.w - 80, 14, 7); ctx.fillStyle = S.colors.barTrack; ctx.fill();
  if (pc > 0) { E.rr(40, RC.h - 62, Math.max(14, (RC.w - 80) * pc / 100), 14, 7); ctx.fillStyle = S.colors.bar; ctx.fill(); }
  ctx.restore();
}

E.start({
  title: "모션 06 · 렌더링 진행 카드", group: "릴스02 템플릿", file: "motion06", state: S, alpha: true,
  intro: "렌더링 카드가 톡 떠오르고, 진행 막대와 퍼센트가 올라가며 미리보기 이미지가 서서히 드러나요.",
  images: { "img.render": [{ file: "m06_render.jpg" }] },
  sections: [
    { title: "공통", hint: "크로마키면 점 격자와 그림자 없이 단색으로 채워져 캡컷에서 바로 지울 수 있어요.",
      rows: [[{ type: "select", key: "keyMode", label: "배경 방식", options: [["dark", "어두운 배경 + 점 격자"], ["green", "단색 배경 (크로마키)"]] }],
        [{ type: "color", key: "keyBg", label: "크로마키 색" }, { type: "number", key: "cardScale", label: "카드 크기 배율 (1 = 원래)", min: .4, max: 1.6 }],
        [{ type: "sub", label: "색상" }], [{ type: "color", key: "colors.bg", label: "배경" }, { type: "color", key: "colors.grid", label: "점 격자" }]] },
    { title: "① 카드 등장", durKey: "1",
      rows: [[{ type: "images", key: "img.render", label: "렌더링 미리보기 이미지" }, { type: "bool", key: "showImage", label: "이미지 서서히 보이기" }],
        [{ key: "fileName", label: "파일 이름" }, { type: "number", key: "d1", label: "길이 (프레임)", min: 4, max: 40 }],
        [{ type: "sub", label: "색상" }], [{ type: "color", key: "colors.render", label: "렌더링 카드" }, { type: "color", key: "colors.renderName", label: "파일 이름 글자" }]] },
    { title: "② 진행", durKey: "2",
      rows: [[{ type: "number", key: "pctStart", label: "시작 퍼센트", min: 0, max: 100 }, { type: "number", key: "pctEnd", label: "마지막 퍼센트", min: 1, max: 100 }],
        [{ type: "number", key: "d2", label: "길이 (프레임)", min: 8, max: 240 }],
        [{ type: "sub", label: "색상" }], [{ type: "color", key: "colors.pct", label: "퍼센트 숫자" }, { type: "color", key: "colors.bar", label: "진행 막대" }],
        [{ type: "color", key: "colors.barTrack", label: "막대 바탕" }]] },
    { title: "③ 마지막 멈춤", durKey: "3",
      rows: [[{ type: "number", key: "d3", label: "길이 (프레임)", min: 1, max: 120 }]] },
  ],
  durations: { 1: S => +S.d1, 2: S => +S.d2, 3: S => +S.d3 },
  length: () => T().total,
  render(f) {
    ctx = E.ctx;
    if (S.keyMode === "green") { ctx.fillStyle = S.keyBg; ctx.fillRect(0, 0, W, H); }
    else { ctx.fillStyle = S.colors.bg; ctx.fillRect(0, 0, W, H); ctx.fillStyle = S.colors.grid; for (let y = 22; y < H; y += 44) for (let x = 22; x < W; x += 44) ctx.fillRect(x - 1.5, y - 1.5, 3, 3); }
    renderCard(f);
  },
});
</script>
