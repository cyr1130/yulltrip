    ctx.font = `500 10.5px ${E.SANS}`; const bw = Math.min(290, Math.max(ctx.measureText(S.ask1).width, ctx.measureText(S.ask2).width) + 50), bx = 317 - bw;

  steps.forEach((st, i) => {
    const a = easeOut(prog(f, s + 34 + i * 24, s + 42 + i * 24)); if (a <= 0) return;

    ctx.save(); ctx.globalAlpha *= a; ctx.font = `500 10.5px ${E.SANS}`;

  ctx.beginPath(); ctx.arc(sx, ry, sr, 0, 7); ctx.fillStyle = "#ffffff"; ctx.fill(); E.rr(sx - 3.5, ry - 3.5, 7, 7, 1.2); ctx.fillStyle = "#111"; ctx.fill();
  ctx.font = `400 7.5px ${E.SANS}`; ctx.fillStyle = "#555"; ctx.textAlign = "center"; ctx.fillText("AI 생성 콘텐츠", PW / 2, PHH - 14); ctx.textAlign = "left";

}

function cardSize() {

  ctx.translate(cx, cy); ctx.scale(s, s); ctx.translate(-cx, -cy);

    E.rr(x + 2, y - 48, 28, 28, 6); ctx.strokeStyle = cc.label; ctx.lineWidth = 2.5; ctx.stroke(); ctx.beginPath(); ctx.arc(x + 16, y - 34, 5, 0, 7); ctx.stroke();

    ctx.font = `500 ${fs}px ${E.SANS}`; ctx.textBaseline = "middle"; const tw = ctx.measureText(S.playerTime).width, pw = 80 + tw + 30;
