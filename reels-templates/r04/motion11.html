    { title: "공통", rows: [...U.bgRows, [{ type: "number", key: "scale", label: "페이지 크기 배율", min: .3, max: 1.05 }, { type: "bool", key: "showCursor", label: "마우스 커서" }],
      [{ type: "bool", key: "camera", label: "확대 카메라" }, { type: "number", key: "zoomType", label: "입력할 때 확대", min: 1, max: 2.4 }, { type: "number", key: "zoomAd", label: "클릭할 때 확대", min: 1, max: 2 }]] },
    { title: "① 등장", durKey: "1", rows: [[{ key: "logo", label: "로고 글자" }, { type: "number", key: "d1", label: "길이 (프레임)", min: 4, max: 60 }]] },
    { title: "② 검색창 클릭", durKey: "2", rows: [[{ type: "number", key: "d2", label: "길이 (프레임)", min: 8, max: 60 }]] },
    { title: "③ 입력", durKey: "3", hint: "한글은 자음 → 모음 → 받침 순서로 조합되며 써져요.",
      rows: [[{ key: "query", label: "검색어" }, { type: "color", key: "colors.caret", label: "커서 색" }], [{ type: "number", key: "d3", label: "길이 (프레임)", min: 8, max: 200 }]] },
    { title: "④ 검색 결과", durKey: "4", hint: "아래 링크는 줄마다 '제목 | 설명' (최대 8줄). 탭 이름 뒤에 ▾ 를 붙이면 화살표가 붙어요.",
      rows: [[{ type: "textarea", key: "tabs", label: "탭 목록" }], [{ type: "number", key: "tabOn", label: "선택된 탭 번호", min: 1, max: 12 }, { key: "adLabel", label: "광고 머리글" }],
        [{ key: "domain", label: "사이트 이름" }, { key: "url", label: "주소" }], [{ key: "title", label: "광고 제목 (클릭됨)" }], [{ key: "desc", label: "광고 설명" }],
        [{ type: "images", key: "img.fav", label: "사이트 아이콘 (비우면 기본)", max: 1 }],
        [{ type: "textarea", key: "links", label: "아래 링크 목록" }], [{ type: "number", key: "d4", label: "길이 (프레임)", min: 10, max: 120 }]] },
    { title: "⑤ 제목 클릭", durKey: "5", rows: [[{ type: "bool", key: "highlight", label: "클릭 후 빨간 강조 박스" }, { type: "color", key: "colors.hl", label: "강조 색" }],
        [{ type: "number", key: "d5", label: "길이 (프레임)", min: 12, max: 90 }, { type: "number", key: "d6", label: "끝 유지 (프레임)", min: 0, max: 120 }],
        [{ type: "sub", label: "색상" }], [{ type: "color", key: "colors.page", label: "페이지" }, { type: "color", key: "colors.link", label: "링크 제목" }],
        [{ type: "color", key: "colors.text", label: "글자" }, { type: "color", key: "colors.muted", label: "설명 글자" }]] },
    { title: "⑥ 드리미나 탭 → 메뉴 클릭", durKey: "6", hint: "메뉴는 줄마다 하나. 뒤에 '| new' 를 붙이면 파란 글씨 + New 배지. 번호는 위에서부터 1, 2, 3…",
      rows: [[{ type: "bool", key: "tabSwitch", label: "드리미나 탭으로 넘어가기" }, { key: "brand", label: "로고 글자" }],
        [{ type: "textarea", key: "menu", label: "메뉴 목록" }], [{ type: "number", key: "menuFrom", label: "처음 선택된 메뉴", min: 1, max: 12 }, { type: "number", key: "menuTo", label: "눌러서 바뀌는 메뉴", min: 1, max: 12 }],
        [{ type: "number", key: "d7", label: "넘어가기 (프레임)", min: 8, max: 60 }, { type: "number", key: "d8", label: "클릭까지 (프레임)", min: 12, max: 90 }, { type: "number", key: "d9", label: "끝 유지 (프레임)", min: 0, max: 120 }],
        [{ type: "color", key: "side.bg", label: "사이드바 배경" }, { type: "color", key: "side.on", label: "선택 칸" }]] },
  ],
  images: { "img.fav": [] },
  durations: { 1: S => +S.d1, 2: S => +S.d2, 3: S => +S.d3, 4: S => +S.d4, 5: S => +S.d5 + +S.d6, 6: S => S.tabSwitch ? +S.d7 + +S.d8 + +S.d9 : 0 },
  length: () => T().total,
  render(f) {
    ctx = E.ctx; const t = T(); U.bg(S);
    const PH = pageH(), base = (+S.scale || 1) * Math.min(W * .94 / PW, H * .9 / PH);
    const p = easeOut(prog(f, 0, 14)), [z, fx, fy] = camera(f, t), K = base * z * lerp(.96, 1, p);
    // 커서 경로 (페이지 좌표)
    const box = [TX + 230, TY + 6], ttl = [60 + Math.min(300, measureTitle() * .45), TITLE_Y + 6], aside = [880, 190];
    const a1 = easeInOut(prog(f, t.s2 - 2, t.boxClick)), a2 = easeInOut(prog(f, t.boxClick + 6, t.boxClick + 18)), a3 = easeInOut(prog(f, t.s5 + 2, t.adClick - 3));
    let cx = lerp(PW * .82, box[0], a1), cy = lerp(PH + 260, box[1], a1);
    cx = lerp(cx, aside[0], a2); cy = lerp(cy, aside[1], a2); cx = lerp(cx, ttl[0], a3); cy = lerp(cy, ttl[1], a3);
    const hover = clamp((a3 - .9) * 10);
    const q = S.tabSwitch ? easeInOut(prog(f, t.s7, t.s7 + 16)) : 0;
    if (q < 1) {
    ctx.save(); ctx.globalAlpha = clamp(p * 1.4) * (1 - q);
    ctx.translate(W / 2 - q * W * .5, H / 2 + lerp(80, 0, p)); ctx.scale(K, K); ctx.translate(-fx, -fy);
    U.shadow(S, () => { E.rr(0, 0, PW, PH, 36); ctx.fillStyle = S.colors.page; ctx.fill(); }, 70, 24, "rgba(0,0,0,.5)");
    page(f, t, { hover });
    if (S.showCursor) {
      const press = Math.max(Math.sin(Math.PI * prog(f, t.boxClick - 2, t.boxClick + 4)), Math.sin(Math.PI * prog(f, t.adClick - 2, t.adClick + 4)));
      U.ripple(box[0], box[1], prog(f, t.boxClick, t.boxClick + 14), "#1a73e8", 50);
      U.ripple(ttl[0], ttl[1], prog(f, t.adClick, t.adClick + 14), "#1a0dab", 60);
      U.arrow(cx, cy, 1.5 / z, clamp(a1 * 3), press, U.green(S));
    }
    ctx.restore();
    }
    if (q > 0) {
      const SH = sideH(), k2 = (+S.scale || 1) * Math.min(W * .62 / SW, H * .8 / SH);
      ctx.save(); ctx.globalAlpha = q; ctx.translate(W / 2 + (1 - q) * W * .5, H / 2); ctx.scale(k2, k2); ctx.translate(-SW / 2, -SH / 2);
      U.shadow(S, () => { E.rr(0, 0, SW, SH, 30); ctx.fillStyle = S.side.bg; ctx.fill(); }, 60, 20, "rgba(0,0,0,.6)");
      const r = sidebar(f, t);
      if (S.showCursor) {
        const b = easeInOut(prog(f, t.s8 - 4, t.menuClick - 2)), mx = lerp(SW * .9, r.x, b), my = lerp(SH + 140, r.y, b);
        const press = Math.sin(Math.PI * prog(f, t.menuClick - 2, t.menuClick + 4));
        U.ripple(r.x, r.y, prog(f, t.menuClick, t.menuClick + 14), "#ffffff", 46);
        U.arrow(mx, my, 1.1, clamp(b * 3), press, U.green(S));
      }
      ctx.restore();
    }
  },
});
