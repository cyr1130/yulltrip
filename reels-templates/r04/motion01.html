<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>모션 01</title>
<script src="https://cdn.jsdelivr.net/npm/mp4-muxer@5.1.3/build/mp4-muxer.js"></script>
<script src="assets_m01.js"></script><script src="engine.js"></script><script src="common.js"></script></head>
<body>
<script>
const E = Engine, U = U04, I = U04.icons; let ctx;
const { W, H, FPS, clamp, lerp, prog, easeOut, easeIn, easeInOut, back } = E;

const NODES = [
  { label: "500일의 썸머_길이 다듬기", kind: "video", badge: "" },
  { label: "엘레베이터 배경01", kind: "image", badge: "" },
  { label: "엘레베이터 배경02", kind: "image", badge: "" },
  { label: "남자주인공", kind: "image", badge: "" },
  { label: "여자주인공", kind: "image", badge: "" },
  { label: "500일의 썸머_길이 다듬기_모션 캡처", kind: "video", badge: "AI" },
  { label: "500일의 썸머_길이 다듬기_모션 캡처_길이 다듬기", kind: "video", badge: "AI" },
  { label: "동영상 1", kind: "video", badge: "초안" },
];
const S = {
  keyMode: "solid", bg: "#0f0f0f", keyBg: "#00ff00", showDots: true,
  layout: "tall", focus: "all", zoomMode: "zoomin", hidePlay: true, dimOthers: false,
  img: { n0: [], n1: [], n2: [], n3: [], n4: [], n5: [], n6: [], n7: [] },
  n: Object.fromEntries(NODES.map((o, i) => ["n" + i, { ...o }])),
  resultCount: "3", genText: "생성 중", showGen: true,
  colors: { dot: "#2e2e2e", label: "#8e8e8e", line: "#6a6a6a", node: "#1d1d1d", badge: "#ffffff", play: "#000000", shimmer: "#3a3a3a" },
  d1: 30, d2: 22, d3: 40, d4: 60, zoomDur: 30,
};
const T = () => { const a = +S.d1, b = +S.d2, c = S.showGen ? +S.d3 : 8, d = +S.d4; return { s2: a, s3: a + b, s4: a + b + c, total: a + b + c + d }; };
const im = i => U.img(S, "img.n" + i);

// 노드 배치 (x, y, w, h) — 가로 = 캡처 원본 배치, 세로 = 릴스용으로 다시 쌓은 배치
const LAYOUT = {
  wide: { u: 1, port: "h", edges: [[0, 5], [5, 6], [6, 7], [1, 2], [1, 7], [2, 7], [3, 7], [4, 7]],
    r: [[87, 87, 561, 239], [771, 87, 240, 320], [1052, 87, 240, 320], [1410, 87, 240, 360], [1691, 87, 240, 360], [87, 631, 561, 240], [701, 631, 561, 240], [1409, 631, 429, 240]] },
  // 세로 배치: [출발 노드, 도착 노드, 출발 x(아래 변), 도착 x(위 변)] — 이름표·다른 노드를 피해서 지나가도록 지정
  tall: { u: 1.6, port: "v", edges: [[0, 5, 500, 0, "left"], [5, 6, 790, 790], [6, 7, 710, 710], [1, 7, 228, 710], [2, 7, 542, 710], [3, 7, 878, 710], [4, 7, 1192, 710]],
    r: [[80, 240, 780, 332], [80, 1530, 295, 400], [395, 1530, 295, 400], [730, 1530, 295, 450], [1045, 1530, 295, 450], [580, 670, 780, 332], [80, 1100, 780, 332], [370, 2070, 700, 394]] },
};
const ORDER = [0, 5, 6, 1, 2, 3, 4];   // 7(결과)은 마지막에 생성
const L = () => LAYOUT[S.layout] || LAYOUT.tall;

// ---------- 카메라 ----------
function overviewCam() {
  const l = L(), u = l.u; let x0 = 1e9, y0 = 1e9, x1 = -1e9, y1 = -1e9;
  l.r.forEach(([x, y, w, h]) => { x0 = Math.min(x0, x); y0 = Math.min(y0, y - 44 * u); x1 = Math.max(x1, x + w); y1 = Math.max(y1, y + h); });
  const m = 60, s = Math.min((W - 2 * m) / (x1 - x0), (H - 2 * m) / (y1 - y0));
  return { x: (x0 + x1) / 2, y: (y0 + y1) / 2, s };
}
function focusCam(i) {
  const l = L(), u = l.u, [x, y, w, h] = l.r[i], top = y - 44 * u, bw = w + 30 * u, bh = h + 44 * u + 20 * u;
  const s = Math.min((W - 90) / bw, (H - 500) / bh);
  return { x: x + w / 2, y: (top + y + h) / 2, s };
}
function camAt(f, t) {
  const ov = overviewCam();
  if (S.focus === "all") { const k = lerp(1, 1.035, easeInOut(prog(f, 0, t.total))); return { ...ov, s: ov.s * k }; }
  const fc = focusCam(+S.focus);
  if (S.zoomMode === "close") { const k = lerp(1, 1.05, easeInOut(prog(f, 0, t.total))); return { ...fc, s: fc.s * k }; }
  const zs = t.s4 + 2, p = easeInOut(prog(f, zs, zs + +S.zoomDur));
  const k = lerp(1, 1.025, easeInOut(prog(f, zs + +S.zoomDur, t.total)));
  return { x: lerp(ov.x, fc.x, p), y: lerp(ov.y, fc.y, p), s: Math.exp(lerp(Math.log(ov.s), Math.log(fc.s), p)) * k };
}
let CAM = { x: 0, y: 0, s: 1 };
const focusAmt = (f, t) => S.focus === "all" ? 0 : S.zoomMode === "close" ? 1 : easeInOut(prog(f, t.s4 + 2, t.s4 + 2 + +S.zoomDur));

// ---------- 그리기 ----------
function dots() {
  if (!S.showDots || U.green(S)) return;
  const u = L().u, step = 22 * u * CAM.s, r = Math.max(1, Math.min(3.2, 1.25 * u * CAM.s));
  if (step < 6) return;
  const ox = W / 2 - CAM.x * CAM.s, oy = H / 2 - CAM.y * CAM.s, sx = ((ox % step) + step) % step, sy = ((oy % step) + step) % step;
  ctx.fillStyle = S.colors.dot;
  for (let y = sy; y < H; y += step) for (let x = sx; x < W; x += step) { ctx.beginPath(); ctx.arc(x, y, r, 0, 7); ctx.fill(); }
}
function bezPts(a, b, port, u) {
  if (port === "h") { const c = Math.max(70 * u, Math.abs(b[0] - a[0]) * .45); return [a, [a[0] + c, a[1]], [b[0] - c, b[1]], b]; }
  const c = Math.max(22 * u, Math.abs(b[1] - a[1]) * .5); return [a, [a[0], a[1] + c], [b[0], b[1] - c], b];
}
function cubic(P, t) { const m = 1 - t; return [0, 1].map(k => m * m * m * P[0][k] + 3 * m * m * t * P[1][k] + 3 * m * t * t * P[2][k] + t * t * t * P[3][k]); }
function labelEnd(j) {   // 노드 이름표 오른쪽 끝 x
  const l = L(), u = l.u; ctx.save(); ctx.font = `400 ${19 * u}px ${E.SANS}`; const w = ctx.measureText(S.n["n" + j].label).width; ctx.restore(); return l.r[j][0] + 30 * u + w;
}
function link(i, j, p, ox, ix, mode) {
  if (p <= 0) return; const l = L(), u = l.u, A = l.r[i], B = l.r[j];
  let a, b;
  if (l.port === "h") { a = [A[0] + A[2], A[1] + A[3] / 2]; b = [B[0], B[1] + B[3] / 2]; }
  else {
    const m = 36 * u, inX = clamp(Math.max(ix ?? B[0] + B[2] / 2, j === 7 ? 0 : labelEnd(j) + 20 * u), B[0] + m, B[0] + B[2] - m);
    a = [clamp(ox ?? A[0] + A[2] / 2, A[0] + m, A[0] + A[2] - m), A[1] + A[3]]; b = mode === "left" ? [B[0], B[1] + B[3] / 2] : [inX, B[1]];
  }
  let P = bezPts(a, b, l.port, u);
  if (l.port === "v" && mode === "left") { const c = Math.abs(b[1] - a[1]) * .62; P = [a, [a[0], a[1] + c], [b[0] - c * .7, b[1]], b]; }   // 아래로 내려와 왼쪽 변으로 들어감
  else if (l.port === "v" && j === 7) { const dy = b[1] - a[1]; P = [a, [a[0], a[1] + dy * .22], [b[0], b[1] - dy * .95], b]; }   // 먼저 옆으로 모인 뒤 내려감 (이름표 위로 지나감)
  ctx.beginPath(); ctx.moveTo(...a); for (let k = 1; k <= 48; k++) { const t = p * k / 48; ctx.lineTo(...cubic(P, t)); }
  ctx.strokeStyle = S.colors.line; ctx.lineWidth = 1.6 * u; ctx.lineCap = "round"; ctx.lineJoin = "round"; ctx.stroke();
  if (l.port === "v") { ctx.fillStyle = S.colors.line; ctx.beginPath(); ctx.arc(a[0], a[1], 3.2 * u, 0, 7); ctx.fill(); if (p > .97) { ctx.beginPath(); ctx.arc(b[0], b[1], 3.2 * u, 0, 7); ctx.fill(); } }
}
function labelRow(i, x, y, u) {
  const o = S.n["n" + i]; ctx.save();
  (o.kind === "image" ? I.image : I.video)(x + 10 * u, y, 20 * u, S.colors.label, 1.8);
  ctx.fillStyle = S.colors.label; ctx.font = `400 ${19 * u}px ${E.SANS}`; ctx.textBaseline = "middle"; ctx.fillText(o.label, x + 30 * u, y + 1); ctx.restore();
}
function badge(text, x, y, u, rightAlign) {
  if (!text) return; ctx.save(); ctx.font = `500 ${13 * u}px ${E.SANS}`; const w = ctx.measureText(text).width + 12 * u, h = 22 * u, bx = rightAlign ? x - w : x;
  E.rr(bx, y, w, h, 5 * u); ctx.fillStyle = "rgba(0,0,0,.35)"; ctx.fill(); ctx.strokeStyle = E.hexA(S.colors.badge, .45); ctx.lineWidth = 1.2 * u; ctx.stroke();
  ctx.fillStyle = S.colors.badge; ctx.textBaseline = "middle"; ctx.fillText(text, bx + 6 * u, y + h / 2 + .5); ctx.restore();
}
function countPill(text, x, y, u) {
  if (!text) return; ctx.save(); ctx.font = `600 ${15 * u}px ${E.SANS}`; const tw = ctx.measureText(text).width, w = tw + 36 * u, h = 26 * u;
  E.rr(x - w, y, w, h, 7 * u); ctx.fillStyle = "rgba(20,20,20,.72)"; ctx.fill();
  ctx.fillStyle = "#fff"; ctx.textBaseline = "middle"; ctx.fillText(text, x - w + 9 * u, y + h / 2 + .5); I.chevron(x - 12 * u, y + h / 2, 14 * u, "#fff", 2.2); ctx.restore();
}
function playBtn(cx, cy, u, a) {
  if (a <= 0) return; ctx.save(); ctx.globalAlpha *= a; ctx.beginPath(); ctx.arc(cx, cy, 17 * u, 0, 7); ctx.fillStyle = E.hexA(S.colors.play, .62); ctx.fill();
  ctx.beginPath(); ctx.moveTo(cx - 5 * u, cy - 7.5 * u); ctx.lineTo(cx + 8 * u, cy); ctx.lineTo(cx - 5 * u, cy + 7.5 * u); ctx.closePath(); ctx.fillStyle = "#fff"; ctx.fill(); ctx.restore();
}
function node(i, p, f, t) {
  if (p <= 0) return; const l = L(), u = l.u, [x, y, w, h] = l.r[i], o = S.n["n" + i], r = 8 * u;
  const sc = lerp(.9, 1, back(p)), cx = x + w / 2, cy = y + h / 2;
  ctx.save(); ctx.globalAlpha *= clamp(p * 1.6); ctx.translate(cx, cy); ctx.scale(sc, sc); ctx.translate(-cx, -cy);
  labelRow(i, x, y - 30 * u, u);
  const isResult = i === 7, focused = S.focus === String(i);
  // 결과 노드: 생성 중 → 공개
  let reveal = 1;
  if (isResult && S.showGen) reveal = easeInOut(prog(f - t.s3, +S.d3 * .72, +S.d3));
  if (reveal < 1) {
    E.rr(x, y, w, h, r); ctx.fillStyle = S.colors.node; ctx.fill();
    ctx.save(); E.rr(x, y, w, h, r); ctx.clip(); const sw = w * .6, sx = x - sw + ((f * 9 * u) % (w + sw * 2));
    const g = ctx.createLinearGradient(sx, 0, sx + sw, 0); g.addColorStop(0, E.hexA(S.colors.shimmer, 0)); g.addColorStop(.5, E.hexA(S.colors.shimmer, 1)); g.addColorStop(1, E.hexA(S.colors.shimmer, 0));
    ctx.fillStyle = g; ctx.fillRect(x, y, w, h); ctx.restore();
    const pct = Math.min(99, Math.round(easeOut(prog(f - t.s3, 0, +S.d3 * .72)) * 99));
    ctx.fillStyle = "#cfcfcf"; ctx.font = `500 ${17 * u}px ${E.SANS}`; ctx.textAlign = "center"; ctx.textBaseline = "middle"; ctx.fillText(`${S.genText} ${pct}%`, cx, cy); ctx.textAlign = "left";
  }
  if (reveal > 0) {
    ctx.save(); ctx.globalAlpha *= reveal; const bl = (1 - reveal) * 14 * u; if (bl > .5) ctx.filter = `blur(${bl}px)`;
    U.photo(im(i), x, y, w, h, r, S.colors.node, lerp(1.06, 1, reveal)); ctx.restore(); ctx.filter = "none";
    if (o.kind === "video") playBtn(cx, cy, u, reveal * (S.hidePlay && focused ? 1 - focusAmt(f, t) : 1));
    badge(o.badge, x + 10 * u, y + 10 * u, u);
    if (isResult) countPill(S.resultCount, x + w - 10 * u, y + 10 * u, u);
  }
  ctx.restore();
}

const nodeFields = i => [
  [{ type: "images", key: "img.n" + i, label: "이미지 / 영상 캡처" }, { type: "select", key: `n.n${i}.kind`, label: "종류", options: [["video", "영상 (재생 버튼)"], ["image", "이미지"]] }],
  [{ key: `n.n${i}.label`, label: "이름" }, { key: `n.n${i}.badge`, label: "왼쪽 위 배지 (비우면 없음)" }],
];

E.start({
  title: "모션 01 · 드리미나 캔버스 + 노드 확대", group: "릴스04 템플릿", file: "motion01", state: S, alpha: true,
  intro: "점 격자 캔버스에 노드가 하나씩 뜨고 연결선이 그려진 뒤, 마지막 '동영상 1'이 생성돼요. '확대할 노드'를 고르면 그 노드로 줌인한 영상으로 저장돼요. 아래 '노드별 확대 영상 모두 저장'을 누르면 8개를 한 번에 저장해요.",
  images: Object.fromEntries(NODES.map((_, i) => ["img.n" + i, [{ file: `m01_n${i}.jpg` }]])),
  sections: [
    { title: "확대 (카메라)", hint: "'전체 화면'이면 캔버스 전체가 나와요. 노드를 고르면 그 노드 영역을 크게 보여주는 영상이 돼요.",
      rows: [[{ type: "select", key: "focus", label: "확대할 노드", options: [["all", "전체 화면"], ...NODES.map((o, i) => [String(i), `${i + 1}. ${o.label}`])] }],
        [{ type: "select", key: "zoomMode", label: "확대 방식", options: [["zoomin", "전체 → 노드로 줌인"], ["close", "처음부터 노드 확대"]] }, { type: "number", key: "zoomDur", label: "줌인 길이 (프레임)", min: 6, max: 120 }],
        [{ type: "bool", key: "hidePlay", label: "확대되면 재생 버튼 숨기기" }, { type: "bool", key: "dimOthers", label: "나머지 노드 어둡게" }]] },
    { title: "공통 · 캔버스", rows: [...U.bgRows,
        [{ type: "select", key: "layout", label: "노드 배치", options: [["tall", "세로 (릴스용)"], ["wide", "가로 (캡처 원본 배치)"]] }, { type: "bool", key: "showDots", label: "점 격자" }],
        [{ type: "sub", label: "색상" }],
        [{ type: "color", key: "colors.dot", label: "점 격자" }, { type: "color", key: "colors.label", label: "노드 이름" }],
        [{ type: "color", key: "colors.line", label: "연결선" }, { type: "color", key: "colors.node", label: "빈 노드" }]] },
    { title: "타이밍", rows: [
        [{ type: "number", key: "d1", label: "① 노드 등장 (프레임)", min: 6, max: 120 }, { type: "number", key: "d2", label: "② 연결선 (프레임)", min: 4, max: 120 }],
        [{ type: "number", key: "d3", label: "③ 결과 생성 (프레임)", min: 6, max: 160 }, { type: "number", key: "d4", label: "④ 머무름 (프레임)", min: 6, max: 240 }],
        [{ type: "bool", key: "showGen", label: "결과 노드 '생성 중' 연출" }, { key: "genText", label: "생성 중 문구" }]] },
    ...NODES.map((o, i) => ({ title: `노드 ${i + 1}`, closed: i > 0, rows: [...nodeFields(i), ...(i === 7 ? [[{ key: "resultCount", label: "오른쪽 위 개수 (비우면 없음)" }]] : [])] })),
  ],
  length: () => T().total,
  render(f) {
    ctx = E.ctx; const t = T();
    U.bg(S); CAM = camAt(f, t);
    dots();
    ctx.save(); ctx.translate(W / 2, H / 2); ctx.scale(CAM.s, CAM.s); ctx.translate(-CAM.x, -CAM.y);
    const l = L(), step = (+S.d1 - 10) / Math.max(1, ORDER.length - 1);
    const np = i => i === 7 ? easeOut(prog(f - t.s3, 0, 9)) : easeOut(prog(f, ORDER.indexOf(i) * step, ORDER.indexOf(i) * step + 10));
    const dim = S.dimOthers && S.focus !== "all" ? lerp(1, .22, focusAmt(f, t)) : 1;
    ctx.globalAlpha = dim; l.edges.forEach(([i, j, ox, ix, mode], k) => link(i, j, easeInOut(prog(f - t.s2, k * 2, k * 2 + 14)), ox, ix, mode));
    [...ORDER, 7].forEach(i => { ctx.globalAlpha = S.focus === String(i) ? 1 : dim; node(i, np(i), f, t); }); ctx.globalAlpha = 1;
    ctx.restore();
  },
}).then(() => {
  // 노드별 확대 영상 모두 저장
  const bar = document.querySelector(".bar"), b = document.createElement("button"); b.className = "btn"; b.textContent = "노드별 확대 영상 모두 저장";
  b.title = "확대할 노드를 1~8번으로 바꿔가며 MP4 를 차례로 저장해요";
  bar.insertBefore(b, document.getElementById("status"));
  b.onclick = async () => {
    const sel = document.querySelector('[data-key="focus"]'), ex = document.getElementById("export"), st = document.getElementById("status"), prev = sel.value, file0 = window.__def.file;
    b.disabled = true;
    for (let i = 0; i < NODES.length; i++) {
      sel.value = String(i); sel.dispatchEvent(new Event("change"));
      window.__def.file = `motion01_노드${i + 1}_` + String(S.n["n" + i].label).replace(/[\\/:*?"<>|\s]+/g, "_").slice(0, 30);
      ex.click(); await new Promise(r => setTimeout(r, 80));
      while (ex.disabled) await new Promise(r => setTimeout(r, 200));
      st.textContent = `노드 ${i + 1}/${NODES.length} 저장됨`;
    }
    window.__def.file = file0; sel.value = prev; sel.dispatchEvent(new Event("change")); b.disabled = false;
    st.textContent = `노드 ${NODES.length}개 확대 영상을 모두 저장했어요`;
  };
});
</script>
