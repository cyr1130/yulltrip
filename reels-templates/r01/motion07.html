function panelBox(r, a = 1) {

  E.shadowed(() => { E.rr(r.x, r.y, r.w, r.h, 26); ctx.fillStyle = S.colors.panel; ctx.fill(); }, 50, 20, "rgba(0,0,0,.55)");

  ctx.restore();

// 패널 내용: 975x1230 기준 좌표로 그림 (f2 = 36프레임 기준 시간)
function wrapLines(text, font, maxW) {   // 전체 문장 기준으로 줄을 미리 나눠서, 타이핑 중에 줄이 다시 흐르지 않게

// 사람처럼: 글자마다 속도가 조금씩 다르고 띄어쓰기·쉼표 뒤에 살짝 멈칫
function typedCount(text, p) {
  const ch = Array.from(text); if (!ch.length) return 0;
  const w = ch.map((c, i) => (c === " " ? 1.9 : /[,.!?]/.test(c) ? 2.6 : 1) * (0.75 + 0.5 * ((Math.sin(i * 12.9898) * 43758.5453) % 1 + 1) % 1));
  const tot = w.reduce((a, b) => a + b, 0); let acc = 0, target = clamp(p) * tot;

function panelContent(f2, sendT) {

  ctx.fillStyle = S.colors.panelTitle; ctx.font = `600 38px ${E.SANS}`; ctx.textBaseline = "middle"; ctx.fillText(S.panelTitle, 44, 66);
  ctx.strokeStyle = S.colors.panelTitle; ctx.lineWidth = 3; [[830, 66], [880, 66]].forEach(([x, y]) => { ctx.strokeRect(x - 13, y - 13, 26, 26); });

  const sent = sendT > 0, p = easeInOut(prog(f2, 5, 29)), all = Array.from(S.typed), n = typedCount(S.typed, p);

  ctx.save(); ctx.translate(890, 1140); ctx.scale(bp, bp);

    E.rr(bx, by, bw, bh, 30); ctx.fillStyle = S.colors.bubble; ctx.fill(); ctx.fillStyle = S.colors.bubbleText; ctx.textBaseline = "top"; bl.forEach((l, i) => ctx.fillText(l, bx + 36, by + 26 + i * BL)); ctx.restore(); }
}
// ② 댓글 시트 (82프레임 기준 타이밍, k 로 길이에 맞춰 늘고 줄어듦)
function avatarCircle(x, y, r, key, color) {
  const a = im(key); ctx.save(); ctx.beginPath(); ctx.arc(x, y, r, 0, 7);
  if (a) { ctx.clip(); const sc = Math.max(2 * r / a.naturalWidth, 2 * r / a.naturalHeight); ctx.drawImage(a, x - a.naturalWidth * sc / 2, y - a.naturalHeight * sc / 2, a.naturalWidth * sc, a.naturalHeight * sc); }
  else { ctx.fillStyle = color; ctx.fill(); }
  ctx.restore();
}
function reply(g, k) {   // 게시자 답글: 작성 중 점 → 답글 등장 → 글자 타이핑 (원댓글과 같은 크기)
  const C = S.colors, AX = 260, AY = 420, TX = AX + 74;
  const dots = prog(g, 38 * k, 45 * k);
  if (dots > 0 && dots < 1) {
    const da = Math.min(easeOut(prog(dots, 0, .2)), 1 - easeIn(prog(dots, .85, 1)));
    ctx.save(); ctx.globalAlpha *= da; avatarCircle(AX, AY, 46, "replyAvatar", C.replyAvatar);

    for (let i = 0; i < 3; i++) { const bo = Math.sin(g * .9 - i * .9) * 7; ctx.beginPath(); ctx.arc(TX + 44 + i * 36, AY + Math.min(0, bo), 10, 0, 7); ctx.fillStyle = C.username; ctx.fill(); }

function heartPath(cx, cy, sz) { ctx.beginPath(); ctx.moveTo(cx, cy + sz * .9); ctx.bezierCurveTo(cx - sz * 1.7, cy - sz * .1, cx - sz * .9, cy - sz * 1.35, cx, cy - sz * .45); ctx.bezierCurveTo(cx + sz * .9, cy - sz * 1.35, cx + sz * 1.7, cy - sz * .1, cx, cy + sz * .9); ctx.closePath(); }

function inputBar(g, k, typed) {

function floatHearts(g, k, mx, my) {

        [{ type: "sub", label: "색상" }], [{ type: "color", key: "colors.sheet", label: "댓글 카드" }, { type: "color", key: "colors.sheetTitle", label: "카드 제목" }], [{ type: "color", key: "colors.avatar", label: "댓글 프로필 (사진 없을 때)" }],
        [{ type: "color", key: "colors.cInput", label: "입력칸" }, { type: "color", key: "colors.cInputLine", label: "입력칸 테두리" }], [{ type: "color", key: "colors.cPlaceholder", label: "안내 문구" }, { type: "color", key: "colors.cInputText", label: "입력 글자" }],
        [{ type: "color", key: "colors.post", label: "게시 버튼" }, { type: "color", key: "colors.username", label: "아이디 · 시간" }], [{ type: "color", key: "colors.commentText", label: "댓글 글자" }, { type: "color", key: "colors.heartOff", label: "하트 (누르기 전)" }],
        [{ type: "color", key: "colors.heartOn", label: "하트 (빨강)" }, { type: "color", key: "colors.floatHeart", label: "떠오르는 하트" }], [{ type: "color", key: "colors.replyAvatar", label: "게시자 프로필 (사진 없을 때)" }, { type: "color", key: "colors.replyText", label: "답글 글자" }]] },
    { title: "③ 로고 엔딩", durKey: "5", hint: "접힌 뒤 화면 전체가 로고 배경색 하나로 이어져요.", rows: [[{ type: "images", key: "img.logo", label: "로고 이미지 (정사각형, 비우면 글자)" }, { key: "logoText", label: "로고 글자 (이미지 없을 때)" }],
        [{ key: "brand", label: "브랜드명 (아래에 타이핑)" }],
        [{ type: "number", key: "d4", label: "접히는 길이", min: 6, max: 40 }, { type: "number", key: "d5", label: "엔딩 길이", min: 12, max: 120 }],
        [{ type: "sub", label: "색상" }], [{ type: "color", key: "colors.logoCard", label: "엔딩 배경 (로고 배경)" }, { type: "color", key: "logoColor", label: "로고 글자" }], [{ type: "color", key: "brandColor", label: "브랜드명" }]] },
  ],
  durations: { 2: S => +S.d2, 3: S => +S.d3, 5: S => +S.d4 + +S.d5 },
  length: () => T().total,
  render(f) {
    ctx = E.ctx; const t = T();
    if (f < t.s4) { darkScene(f); return; }
    // 어두운 화면 전체가 로고 카드 크기로 접힘
    ctx.fillStyle = S.colors.logoCard; ctx.fillRect(0, 0, W, H);
    const c = easeInOut(prog(f - t.s4, 0, +S.d4)), size = 430;
    const w = lerp(W, size, c), h = lerp(H, size, c), rad = lerp(0, size * .21, c);
    if (c < 1) { ctx.save(); E.rr(720 - w / 2, 1280 - h / 2, w, h, rad); ctx.clip(); ctx.translate(720, 1280); const s = lerp(1, size / 1100, c); ctx.scale(s, s); ctx.translate(-720, -1280); inEnding = true; darkScene(t.s4 - .01); inEnding = false; ctx.restore(); }
    const fl = prog(c, .55, 1);
    const pop = f >= t.s5 ? 1 + .06 * Math.sin(Math.PI * prog(f - t.s5, 0, 6)) : 1;
    if (fl > 0) logoCard(720, 1280, size * pop, fl);
    if (f >= t.s5) { const bt = prog(f - t.s5, 3, 3 + Math.max(6, S.brand.length * .9));
      ctx.save(); ctx.fillStyle = S.brandColor; ctx.font = `700 46px ${E.SANS}`; ctx.textAlign = "center"; ctx.textBaseline = "middle"; ctx.fillText(S.brand.slice(0, Math.round(S.brand.length * bt)), 720, 2440); ctx.restore(); }
  },
});
