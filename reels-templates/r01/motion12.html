// ---------- 레이아웃 ----------
function layoutA() {

const BOUNCE = 13;

function sceneA(f, dur) {

  keys.sort((a, b) => a[0] - b[0]);
  const [cx, cy] = kf2(f, keys);
  if (f >= 4) E.cursor(cx, cy, "", CUR[0], 1.1, 1, S.colors.cursorText);   // 이름표 없이, 마지막 장면과 같은 크기

}
function sceneB(f) {

  else rows.forEach(r => { E.dot(r.right + 24, r.y, prog(f, 18, 20)); E.bez([r.right + 24, r.y, r.right + 100, r.y + (1278 - r.y) * .1, 862, lerp(r.y, 1278, .6), 888, 1278], rp, { color: S.colors.line }); });
  if (!glow) E.dot(888, 1278, prog(f, 24, 26));
  const o = easeOut(prog(f, 24, 31));
  if (o > 0 && S.c.output[0]) { ctx.save(); ctx.globalAlpha *= o; E.cover(S.c.output[0].img, 921 + lerp(90, 0, o), 933, 390, 690, 12); ctx.restore(); }

function sceneCD(fc, fd, cDur) {
  const P = { x: 465 + 530 * .42, y: 1179 - 891 * .42 }, pk = cDur / 40;
  const panX = kf(fc, [[0, 996], [8 * pk, 936], [14 * pk, 864], [20 * pk, 676], [26 * pk, 208], [32 * pk, 56], [38 * pk, 0]]);
  const z = easeInOut(prog(fd, 0, 11)), drift = 1 + .03 * easeOut(prog(fd, 9, +S.d.dur));
  const s = Math.exp(lerp(Math.log(1 / .42), 0, z)) * drift;
  const qx = lerp(panX, P.x, z), qy = lerp(0, P.y, z);

  const LA0 = layoutA(), CX = 720;
  let topDX = 0; if (LA0.length) { const lx = Math.min(...LA0.map(r => r.x)), lw = Math.max(...LA0.map(r => r.x + r.w)) - lx, k0 = Math.min(669 / lw, 471 / 465); topDX = CX - (150 + lw * k0 / 2); }

  // 덩어리 간격: 가운데 노드 그룹은 고정, 위 덩어리는 아래로 / 아래 덩어리는 위로 당김

      LA.forEach(r => E.cover(r.o.img, 150 + (r.x - bx) * k, 399 + (r.y - 1005) * k, r.w * k, r.h * k, 5)); }
    if (S.d.notes) E.note(822, 285, .513, S.b.note1, S.colors.note1, S.b.footer, 0, "bottom", S.colors.noteText);
    if (S.d.notes && S.b.note2.trim()) E.note(978, 531, .47, S.b.note2, S.colors.note2, S.b.footer, 0, "bottom", S.colors.noteText);

    ctx.save(); ctx.translate(botDX, BOT_DY);

    if (ex[0]) { ctx.save(); ctx.translate(0, kf(fd, [[4, 60], [16, 0]])); E.cover(ex[0].img, 132, 1770, 312, 276, 4); ctx.restore(); }

      for (let i = 0; i < 18; i++) { const a = i / 18 * Math.PI * 2 + (fd / FPS) * .6; ctx.globalAlpha = dIn * prog(fd, 4 + i * .4, 6 + i * .4); E.emoji(S.d.ring, 165 * Math.cos(a), 165 * Math.sin(a), 46); }
