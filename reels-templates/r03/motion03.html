<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>모션 03</title>
<script src="https://cdn.jsdelivr.net/npm/mp4-muxer@5.1.3/build/mp4-muxer.js"></script>
<script src="assets_m03.js"></script><script src="engine.js"></script><script src="common.js"></script></head>
<body>
<script>
const E = Engine, U = U03; let ctx;
const { W, H, FPS, clamp, lerp, prog, easeOut, easeIn, easeInOut, back } = E;

const S = {
  keyMode: "solid", bg: "#f7f9fb", keyBg: "#00ff00",
  img: { photo: [], avatar: [] },
  name: "", sub: "",
  likes: "71K", comments: "10K", reposts: "4K",
  likedBy: "Likes by friend and others",
  caption: "Your glow starts from within.\nSkin nutrition that actually works — strawberry flavor,\n60 gummies, zero excuses. Meet your new daily ritual.",
  tags: "#GlowGummies #SkinNutrition #GlowUp\n#BeautyFromWithin #SkincareRoutine",
  analyzing: "Analyzing...", analyzed: "Analyzed!",
  items: "Catchy hook\nClear product focus\nUGC format\nAesthetic setting",
  blurMax: 22, showPresenter: true,
  colors: { glow1: "#5fd8ef", glow2: "#d6f53a", pill: "#1b2226", pillText: "#5fd8ef", card: "#191c18", title: "#d6f53a", item: "#d6f53a",
            name: "#111111", text: "#222222", tag: "#2f6fb5", icon: "#111111", heart: "#ff3040", overlay: "#ffffff", avatar: "#f2b04a", ring: "#d4f53c", presenterBg: "#c9d3dc" },
  pillAlpha: 0.82, cardAlpha: 0.86,
  d1: 16, d2: 30, d3: 14, d4: 44,
};
const T = () => { const a = +S.d1, b = +S.d2, c = +S.d3, d = +S.d4; return { s2: a, s3: a + b, s4: a + b + c, total: a + b + c + d }; };
const im = k => U.img(S, "img." + k);
const P = { x: 229, y: 411, w: 982, h: 1738, r: 44 };
const PILL = { w: 640, h: 150, cy: 1211 }, CARD = { x: 340, y: 0, w: 760, h: 0, r: 54 };
// 카드 높이는 항목 수에 맞춤 (가운데 기준 1211)
const fitCard = () => { const n = Math.max(1, Math.min(5, String(S.items).split("\n").filter(Boolean).length)); CARD.h = 178 + n * 92; CARD.y = Math.round(PILL.cy - CARD.h / 2); };
const mix = (a, b, t) => { const A = parseInt(a.slice(1), 16), B = parseInt(b.slice(1), 16), c = s => Math.round(lerp((A >> s) & 255, (B >> s) & 255, t));
  return "#" + [16, 8, 0].map(s => c(s).toString(16).padStart(2, "0")).join(""); };

function glow(f, color, a) {
  if (a <= 0) return;
  const cx = P.x + P.w / 2, cy = P.y + P.h / 2, ang = f * .11;
  const g = ctx.createConicGradient(ang, cx, cy);
  g.addColorStop(0, E.hexA(color, 0)); g.addColorStop(.18, E.hexA(color, 1)); g.addColorStop(.36, E.hexA(color, 0));
  g.addColorStop(.55, E.hexA(color, 0)); g.addColorStop(.72, E.hexA(color, .9)); g.addColorStop(.9, E.hexA(color, 0)); g.addColorStop(1, E.hexA(color, 0));
  ctx.save(); ctx.globalAlpha *= a;
  if (!U.green(S)) { ctx.filter = "blur(36px)"; E.rr(P.x, P.y, P.w, P.h, P.r); ctx.strokeStyle = g; ctx.lineWidth = 50; ctx.stroke(); ctx.filter = "none"; }
  E.rr(P.x, P.y, P.w, P.h, P.r); ctx.clip(); ctx.filter = "blur(30px)"; E.rr(P.x, P.y, P.w, P.h, P.r); ctx.strokeStyle = g; ctx.lineWidth = 120; ctx.stroke();
  ctx.restore(); ctx.filter = "none";
}
function postFrame(f, blur) {
  const c = S.colors;
  ctx.save(); if (blur > .5) ctx.filter = `blur(${blur}px)`; U.photo(im("photo"), P.x, P.y, P.w, P.h, P.r, "#9aa3ab", 1 + blur * .002); ctx.restore(); ctx.filter = "none";
  const hasHead = S.name || S.sub || im("avatar"); if (!hasHead) return;   // 위 UI: 이름·문구·프로필 중 하나라도 넣었을 때만
  ctx.save(); E.rr(P.x, P.y, P.w, P.h, P.r); ctx.clip(); const g = ctx.createLinearGradient(0, P.y, 0, P.y + 200); g.addColorStop(0, "rgba(0,0,0,.28)"); g.addColorStop(1, "rgba(0,0,0,0)"); ctx.fillStyle = g; ctx.fillRect(P.x, P.y, P.w, 200); ctx.restore();
  U.circle(im("avatar"), P.x + 66, P.y + 66, 32, c.avatar);
  ctx.fillStyle = c.overlay; ctx.textBaseline = "middle"; ctx.font = `600 30px ${E.SANS}`; const ty = S.sub ? 0 : 14; ctx.fillText(S.name, P.x + 114, P.y + 52 + ty);
  if (S.sub) { ctx.globalAlpha = .75; ctx.font = `400 24px ${E.SANS}`; ctx.fillText(S.name ? S.name + " · " + S.sub : S.sub, P.x + 114, S.name ? P.y + 86 : P.y + 66); ctx.globalAlpha = 1; }
  U.dots(P.x + P.w - 50, P.y + 60, 40, c.overlay);
}
function spinner(x, y, r, f, color) {
  const a = f * .35; ctx.save(); ctx.strokeStyle = E.hexA(color, .25); ctx.lineWidth = 7; ctx.beginPath(); ctx.arc(x, y, r, 0, 7); ctx.stroke();
  ctx.strokeStyle = color; ctx.lineCap = "round"; ctx.beginPath(); ctx.arc(x, y, r, a, a + Math.PI * (.6 + .3 * Math.sin(f * .2))); ctx.stroke(); ctx.restore();
}
const GLYPH = "abcdefghijklmnopqrstuvwxyz";
function scramble(text, p, seed) {
  const ch = Array.from(text), n = Math.floor(ch.length * p); if (p >= 1) return text;
  let s = ch.slice(0, n).join("");
  for (let i = n; i < Math.min(ch.length, n + 4); i++) s += ch[i] === " " ? " " : GLYPH[(i * 7 + seed * 13) % 26];
  return s;
}

E.start({
  title: "모션 03 · Analyzing → Analyzed", group: "릴스03 템플릿", file: "motion03", state: S, alpha: true,
  intro: "게시물 사진 가장자리로 빛이 돌며 사진이 흐려지고, 가운데 'Analyzing...' 알약이 떠요. 빛이 라임색으로 바뀌면 알약이 큰 카드로 커지며 'Analyzed!'와 분석 항목이 한 줄씩 써져요.",
  images: { "img.photo": [{ file: "m03_photo.jpg" }] },
  sections: [
    { title: "공통 · 사진 카드", hint: "크로마키로 바꾸면 그림자와 바깥쪽 빛 번짐이 꺼지고, 사진 안쪽 빛만 남아요.",
      rows: [...U.bgRows,
        [{ type: "images", key: "img.photo", label: "게시물 사진" }, { type: "images", key: "img.avatar", label: "프로필 사진 (비우면 색 원)" }],
        [{ key: "name", label: "계정 이름 (비우면 위 UI 없음)" }, { key: "sub", label: "이름 아래 문구" }],
        [{ type: "sub", label: "색상" }], [{ type: "color", key: "colors.overlay", label: "사진 위 글자" }, { type: "color", key: "colors.avatar", label: "프로필 (사진 없을 때)" }]] },
    { title: "① 빛 + 분석 중 등장", durKey: "1",
      rows: [[{ key: "analyzing", label: "분석 중 문구" }, { type: "number", key: "d1", label: "길이 (프레임)", min: 6, max: 60 }],
        [{ type: "sub", label: "색상" }], [{ type: "color", key: "colors.glow1", label: "빛 (분석 중)" }, { type: "color", key: "colors.pill", label: "알약 배경" }],
        [{ type: "color", key: "colors.pillText", label: "알약 글자·스피너" }, { type: "number", key: "pillAlpha", label: "알약 불투명도 (0~1)", min: 0, max: 1 }]] },
    { title: "② 분석 중", durKey: "2", hint: "스피너가 돌고 사진이 점점 흐려져요.",
      rows: [[{ type: "number", key: "blurMax", label: "사진 흐림 정도 (px)", min: 0, max: 60 }, { type: "number", key: "d2", label: "길이 (프레임)", min: 6, max: 180 }]] },
    { title: "③ 카드로 커짐", durKey: "3",
      rows: [[{ key: "analyzed", label: "완료 제목" }, { type: "number", key: "d3", label: "길이 (프레임)", min: 6, max: 60 }],
        [{ type: "sub", label: "색상" }], [{ type: "color", key: "colors.glow2", label: "빛 (완료)" }, { type: "color", key: "colors.card", label: "카드 배경" }],
        [{ type: "color", key: "colors.title", label: "제목·체크" }, { type: "number", key: "cardAlpha", label: "카드 불투명도 (0~1)", min: 0, max: 1 }]] },
    { title: "④ 분석 항목", durKey: "4", hint: "한 줄에 하나씩, 글자가 섞이며 써져요 (최대 5줄).",
      rows: [[{ type: "textarea", key: "items", label: "항목 (줄마다 하나)" }],
        [{ type: "number", key: "d4", label: "길이 (프레임)", min: 10, max: 200 }, { type: "color", key: "colors.item", label: "항목 글자" }]] },
  ],
  durations: { 1: S => +S.d1, 2: S => +S.d2, 3: S => +S.d3, 4: S => +S.d4 },
  length: () => T().total,
  render(f) {
    ctx = E.ctx; const t = T(), c = S.colors; U.bg(S); fitCard();
    const blur = +S.blurMax * easeInOut(prog(f, 4, t.s3));
    const gColor = mix(c.glow1, c.glow2, easeInOut(prog(f - t.s3, 0, +S.d3)));
    U.shadow(S, () => { E.rr(P.x, P.y, P.w, P.h, P.r); ctx.fillStyle = "#888"; ctx.fill(); }, 50, 18, "rgba(20,30,40,.16)");
    postFrame(f, blur);
    glow(f, gColor, easeOut(prog(f, 0, 10)));
    // 알약 → 카드
    const pin = back(prog(f, 3, 12)), mo = easeInOut(prog(f - t.s3, 0, +S.d3));
    const pw = PILL.w, ph = PILL.h, px = 720 - pw / 2, py = PILL.cy - ph / 2;
    const rx = lerp(px, CARD.x, mo), ry = lerp(py, CARD.y, mo), rw = lerp(pw, CARD.w, mo), rh = lerp(ph, CARD.h, mo), rr = lerp(ph / 2, CARD.r, mo);
    if (pin > 0) {
      ctx.save(); const sc = mo > 0 ? 1 : lerp(.6, 1, pin); ctx.globalAlpha *= clamp(pin * 2); ctx.translate(720, PILL.cy); ctx.scale(sc, sc); ctx.translate(-720, -PILL.cy);
      ctx.globalAlpha *= lerp(+S.pillAlpha, +S.cardAlpha, mo); E.rr(rx, ry, rw, rh, rr); ctx.fillStyle = mix(c.pill, c.card, mo); ctx.fill();
      ctx.globalAlpha /= lerp(+S.pillAlpha, +S.cardAlpha, mo) || 1;
      E.rr(rx, ry, rw, rh, rr); ctx.strokeStyle = "rgba(255,255,255,.08)"; ctx.lineWidth = 2; ctx.stroke();
      // 분석 중 내용
      const pa = 1 - prog(mo, 0, .35);
      if (pa > 0) { ctx.save(); ctx.globalAlpha *= pa; spinner(px + 84, PILL.cy, 30, f, c.pillText);
        ctx.font = `600 62px ${E.SANS}`; ctx.textBaseline = "middle"; const tx = px + 140, tw = ctx.measureText(S.analyzing).width, sh = ((f * 18) % (tw + 400)) - 200;
        const g = ctx.createLinearGradient(tx + sh - 120, 0, tx + sh + 120, 0); g.addColorStop(0, c.pillText); g.addColorStop(.5, "#ffffff"); g.addColorStop(1, c.pillText);
        ctx.fillStyle = g; ctx.fillText(S.analyzing, tx, PILL.cy + 2); ctx.restore(); }
      // 완료 내용
      const ca = prog(mo, .55, 1);
      if (ca > 0) { ctx.save(); ctx.globalAlpha *= ca;
        const hx = CARD.x + 92, hy = CARD.y + 104; ctx.strokeStyle = c.title; ctx.lineWidth = 4; ctx.beginPath(); ctx.arc(hx, hy, 40, 0, 7); ctx.stroke();
        const ck = prog(f - t.s4, 0, 6); ctx.lineWidth = 6; ctx.lineCap = "round"; ctx.lineJoin = "round"; ctx.beginPath();
        if (ck > 0) { ctx.moveTo(hx - 18, hy + 2); const m = clamp(ck * 2); ctx.lineTo(lerp(hx - 18, hx - 4, m), lerp(hy + 2, hy + 18, m)); if (ck > .5) ctx.lineTo(lerp(hx - 4, hx + 20, (ck - .5) * 2), lerp(hy + 18, hy - 20, (ck - .5) * 2)); ctx.stroke(); }
        ctx.fillStyle = c.title; ctx.font = `700 80px ${E.SANS}`; ctx.textBaseline = "middle"; ctx.fillText(S.analyzed, hx + 74, hy + 4); ctx.restore(); }
      // 항목
      if (f >= t.s4) { const items = String(S.items).split("\n").filter(Boolean).slice(0, 5), d = +S.d4, per = (d * .7) / Math.max(1, items.length);
        ctx.fillStyle = c.item; ctx.font = `600 58px ${E.SANS}`; ctx.textBaseline = "middle";
        items.forEach((it, i) => { const p = prog(f - t.s4, 4 + i * per, 4 + i * per + per * 1.3); if (p <= 0) return; ctx.fillText(scramble(it, p, Math.floor(f / 2) + i), CARD.x + 60, CARD.y + 210 + i * 92); }); }
      ctx.restore();
    }
  },
});
</script>
