<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>모션 01</title>
<script src="https://cdn.jsdelivr.net/npm/mp4-muxer@5.1.3/build/mp4-muxer.js"></script>
<script src="assets_m01.js"></script><script src="engine.js"></script><script src="common.js"></script></head>
<body>
<script>
const E = Engine, U = U03; let ctx;
const { W, H, FPS, clamp, lerp, prog, easeOut, easeIn, easeInOut, back } = E;

const S = {
  keyMode: "solid", bg: "#f7f9fb", keyBg: "#00ff00",
  img: { story: [], post: [], reels: [], avatar: [] },
  name: "yourbrand", storyTime: "4h", sendMsg: "Send Message",
  likesFrom: 6000, likesTo: 11000, comFrom: 440, comTo: 920, shareFrom: 267, shareTo: 559,
  likedBy: "Likes by friend and others", caption: "my \"did i take my vitamins\" panic is officially gone. one jar. four things. tastes like candy. that's it...",
  reelsLikes: "40K", reelsComments: "6K", reelsSub: "Original audio", reelsCaption: "my \"did i take my vitamins\" panic is...",
  showLabels: false, label1: "STORIES", label2: "POSTS", label3: "REELS",
  colors: { card: "#ffffff", name: "#111111", text: "#222222", sub: "#8e8e8e", icon: "#111111", heart: "#ff3040", avatar: "#f2b04a",
            overlayText: "#ffffff", bar: "#ffffff", labelBg: "#2b2b2b", labelText: "#ffffff" },
  d1: 20, d2: 24, d3: 26,
};
const T = () => { const a = +S.d1, b = +S.d2, c = +S.d3; return { s2: a, s3: a + b, total: a + b + c }; };
const im = k => U.img(S, "img." + k);
const CW = 1000, CH = 1780, CX = 720 - CW / 2, CY = 1280 - CH / 2;

function storyCard(lt) {
  const c = S.colors, x = CX, y = CY;
  U.shadow(S, () => { E.rr(x, y, CW, CH, 40); ctx.fillStyle = "#222"; ctx.fill(); }, 60, 24, "rgba(20,30,40,.22)");
  U.photo(im("story"), x, y, CW, CH, 40, "#8a8f96", 1 + .03 * lt);
  ctx.save(); E.rr(x, y, CW, CH, 40); ctx.clip();
  let g = ctx.createLinearGradient(0, y, 0, y + 260); g.addColorStop(0, "rgba(0,0,0,.35)"); g.addColorStop(1, "rgba(0,0,0,0)"); ctx.fillStyle = g; ctx.fillRect(x, y, CW, 260);
  g = ctx.createLinearGradient(0, y + CH - 260, 0, y + CH); g.addColorStop(0, "rgba(0,0,0,0)"); g.addColorStop(1, "rgba(0,0,0,.35)"); ctx.fillStyle = g; ctx.fillRect(x, y + CH - 260, CW, 260);
  ctx.restore();
  // 진행 바 2칸
  const bw = (CW - 60 - 10) / 2;
  for (let i = 0; i < 2; i++) { E.rr(x + 30 + i * (bw + 10), y + 26, bw, 6, 3); ctx.fillStyle = U.green(S) ? E.hexA(c.bar, .5) : E.hexA(c.bar, .45); ctx.fill(); }
  E.rr(x + 30, y + 26, bw * clamp(.35 + lt * .6), 6, 3); ctx.fillStyle = c.bar; ctx.fill();
  U.circle(im("avatar"), x + 78, y + 100, 36, c.avatar);
  ctx.fillStyle = c.overlayText; ctx.font = `600 34px ${E.SANS}`; ctx.textBaseline = "middle"; ctx.fillText(S.name, x + 130, y + 100);
  const nw = ctx.measureText(S.name).width; ctx.globalAlpha *= .75; ctx.font = `400 32px ${E.SANS}`; ctx.fillText(S.storyTime, x + 146 + nw, y + 100); ctx.globalAlpha /= .75;
  // 하단 메시지 바
  E.rr(x + 30, y + CH - 120, CW - 220, 84, 42); ctx.strokeStyle = E.hexA(c.overlayText, .85); ctx.lineWidth = 3; ctx.stroke();
  ctx.fillStyle = E.hexA(c.overlayText, .9); ctx.font = `400 32px ${E.SANS}`; ctx.fillText(S.sendMsg, x + 70, y + CH - 78);
  U.heart(x + CW - 140, y + CH - 78, 52, null, c.overlayText, 2.2); U.send(x + CW - 62, y + CH - 78, 48, c.overlayText, 2.2);
}
function postCard(lt) {
  const c = S.colors, h = 1236, x = CX, y = 1280 - h / 2;
  U.shadow(S, () => { E.rr(x, y, CW, h, 44); ctx.fillStyle = c.card; ctx.fill(); }, 60, 24, "rgba(20,30,40,.14)");
  U.circle(im("avatar"), x + 76, y + 72, 34, c.avatar);
  ctx.fillStyle = c.name; ctx.font = `700 34px ${E.SANS}`; ctx.textBaseline = "middle"; ctx.fillText(S.name, x + 128, y + 72);
  const px = x + 30, py = y + 130, pw = CW - 60, ph = 960;
  U.photo(im("post"), px, py, pw, ph, 30, "#c7d3df", 1 + .03 * lt);
  const k = easeOut(lt), ay = py + ph + 62;
  U.heart(px + 26, ay, 46, c.heart);
  ctx.fillStyle = c.name; ctx.font = `600 34px ${E.SANS}`; ctx.textBaseline = "middle";
  let tx = px + 64; const t1 = U.fmt(lerp(+S.likesFrom, +S.likesTo, k)); ctx.fillText(t1, tx, ay); tx += ctx.measureText(t1).width + 34;
  U.comment(tx + 18, ay, 42, c.icon); tx += 50; const t2 = U.fmt(lerp(+S.comFrom, +S.comTo, k)); ctx.fillText(t2, tx, ay); tx += ctx.measureText(t2).width + 30;
  U.send(tx + 18, ay, 42, c.icon); tx += 50; ctx.fillText(U.fmt(lerp(+S.shareFrom, +S.shareTo, k)), tx, ay);
  U.bookmark(px + pw - 20, ay, 44, c.icon);
}
function reelsCard(lt) {
  const c = S.colors, x = CX, y = CY;
  U.shadow(S, () => { E.rr(x, y, CW, CH, 40); ctx.fillStyle = "#222"; ctx.fill(); }, 60, 24, "rgba(20,30,40,.22)");
  U.photo(im("reels"), x, y, CW, CH, 40, "#8a8f96", 1 + .03 * lt);
  ctx.save(); E.rr(x, y, CW, CH, 40); ctx.clip();
  const g = ctx.createLinearGradient(0, y + CH - 420, 0, y + CH); g.addColorStop(0, "rgba(0,0,0,0)"); g.addColorStop(1, "rgba(0,0,0,.5)"); ctx.fillStyle = g; ctx.fillRect(x, y + CH - 420, CW, 420);
  ctx.restore();
  const rx = x + CW - 66, ry = y + CH * .53, pop = 1 + .25 * Math.sin(Math.PI * prog(lt, .1, .3));
  U.heart(rx, ry, 64 * pop, c.heart);
  ctx.fillStyle = c.overlayText; ctx.font = `600 28px ${E.SANS}`; ctx.textAlign = "center"; ctx.textBaseline = "middle"; ctx.fillText(S.reelsLikes, rx, ry + 54);
  U.comment(rx, ry + 150, 58, c.overlayText, 2.2); ctx.fillText(S.reelsComments, rx, ry + 204);
  U.send(rx, ry + 290, 54, c.overlayText, 2.2); ctx.textAlign = "left";
  const by = y + CH - 200;
  U.circle(im("avatar"), x + 74, by, 34, c.avatar);
  ctx.fillStyle = c.overlayText; ctx.font = `600 30px ${E.SANS}`; ctx.fillText(S.name, x + 124, by - 16);
  ctx.globalAlpha *= .8; ctx.font = `400 26px ${E.SANS}`; ctx.fillText(S.reelsSub, x + 124, by + 20); ctx.globalAlpha /= .8;
  ctx.font = `400 30px ${E.SANS}`; ctx.fillText(S.reelsCaption, x + 40, by + 84);
}

E.start({
  title: "모션 01 · 피드 카드 전환", group: "릴스03 템플릿", file: "motion01", state: S, alpha: true,
  intro: "가운데 카드가 스토리 → 게시물 → 릴스 순서로 톡톡 바뀌어요. 게시물에선 좋아요·댓글·공유 숫자가 올라가고, 릴스에선 하트가 통 튀어요.",
  images: { "img.story": [{ file: "m01_story.jpg" }], "img.post": [{ file: "m01_post.jpg" }], "img.reels": [{ file: "m01_reels.jpg" }] },
  sections: [
    { title: "공통", hint: "크로마키로 바꾸면 카드 그림자 없이 단색 배경이 돼요.",
      rows: [...U.bgRows,
        [{ type: "images", key: "img.avatar", label: "프로필 사진 (비우면 색 원)" }, { key: "name", label: "계정 이름" }],
        [{ type: "bool", key: "showLabels", label: "카드 라벨 (STORIES 등)" }],
        [{ type: "sub", label: "색상" }],
        [{ type: "color", key: "colors.avatar", label: "프로필 (사진 없을 때)" }, { type: "color", key: "colors.overlayText", label: "사진 위 글자·아이콘" }],
        [{ type: "color", key: "colors.labelBg", label: "라벨 배경" }, { type: "color", key: "colors.labelText", label: "라벨 글자" }]] },
    { title: "① 스토리", durKey: "1",
      rows: [[{ type: "images", key: "img.story", label: "스토리 사진" }, { type: "number", key: "d1", label: "길이 (프레임)", min: 6, max: 120 }],
        [{ key: "storyTime", label: "시간 표시" }, { key: "sendMsg", label: "메시지 칸 문구" }], [{ key: "label1", label: "라벨" }],
        [{ type: "sub", label: "색상" }], [{ type: "color", key: "colors.bar", label: "진행 바" }]] },
    { title: "② 게시물", durKey: "2", hint: "좋아요·댓글·공유 숫자가 시작값에서 끝값까지 올라가요.",
      rows: [[{ type: "images", key: "img.post", label: "게시물 사진" }, { type: "number", key: "d2", label: "길이 (프레임)", min: 6, max: 120 }],
        [{ type: "number", key: "likesFrom", label: "좋아요 시작", min: 0, max: 1e8 }, { type: "number", key: "likesTo", label: "좋아요 끝", min: 0, max: 1e8 }],
        [{ type: "number", key: "comFrom", label: "댓글 시작", min: 0, max: 1e8 }, { type: "number", key: "comTo", label: "댓글 끝", min: 0, max: 1e8 }],
        [{ type: "number", key: "shareFrom", label: "공유 시작", min: 0, max: 1e8 }, { type: "number", key: "shareTo", label: "공유 끝", min: 0, max: 1e8 }],
        [{ key: "label2", label: "라벨" }],
        [{ type: "sub", label: "색상" }], [{ type: "color", key: "colors.card", label: "카드" }, { type: "color", key: "colors.name", label: "이름·숫자" }],
        [{ type: "color", key: "colors.icon", label: "아이콘" }], [{ type: "color", key: "colors.heart", label: "하트" }]] },
    { title: "③ 릴스", durKey: "3",
      rows: [[{ type: "images", key: "img.reels", label: "릴스 사진" }, { type: "number", key: "d3", label: "길이 (프레임)", min: 6, max: 120 }],
        [{ key: "reelsLikes", label: "하트 숫자" }, { key: "reelsComments", label: "댓글 숫자" }],
        [{ key: "reelsSub", label: "이름 아래 문구" }, { key: "label3", label: "라벨" }], [{ key: "reelsCaption", label: "캡션" }]] },
  ],
  durations: { 1: S => +S.d1, 2: S => +S.d2, 3: S => +S.d3 },
  length: () => T().total,
  render(f) {
    ctx = E.ctx; const t = T(); U.bg(S);
    const idx = f < t.s2 ? 0 : f < t.s3 ? 1 : 2, st = [0, t.s2, t.s3][idx], len = [+S.d1, +S.d2, +S.d3][idx], lf = f - st, lt = clamp(lf / len);
    const p = idx === 0 ? prog(lf, 0, 7) : prog(lf, 0, 5);
    const sc = idx === 0 ? lerp(.9, 1, back(p)) : lerp(1.05, 1, easeOut(p));
    ctx.save(); ctx.globalAlpha = idx === 0 ? clamp(p * 2) : 1;
    ctx.translate(720, 1280); ctx.scale(sc, sc); ctx.translate(-720, -1280);
    [storyCard, postCard, reelsCard][idx](lt);
    if (S.showLabels) U.labelPill([S.label1, S.label2, S.label3][idx], 720, idx === 1 ? 1210 : 1500, 64, S.colors.labelBg, S.colors.labelText);
    ctx.restore();
  },
});
</script>
